<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kunal@github</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#0a0e14; --frame:#30363d;
    --fg:#c9d1d9; --dim:#7d8590; --green:#39d353; --cyan:#22d3ee;
    --amber:#ffbd2e; --red:#ff5f56;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg2); color:var(--fg);
    font-family:var(--mono); font-size:15px; line-height:1.55;
    display:flex; align-items:center; justify-content:center;
    padding:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
    padding-block:24px;
  }
  .win{
    width:100%; max-width:820px; height:min(82vh,620px);
    background:linear-gradient(180deg,#111722,var(--bg));
    border:1px solid var(--frame); border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;
    border-bottom:1px solid var(--frame);background:rgba(255,255,255,.02);flex:0 0 auto}
  .dot{width:12px;height:12px;border-radius:50%}
  .dot.r{background:var(--red)} .dot.y{background:var(--amber)} .dot.g{background:var(--green)}
  .bar .t{flex:1;text-align:center;color:var(--dim);font-size:12.5px;letter-spacing:.3px}
  .screen{flex:1 1 auto;overflow-y:auto;padding:16px 18px 20px;min-width:0;
    scrollbar-width:thin;scrollbar-color:var(--frame) transparent}
  .screen::-webkit-scrollbar{width:9px}
  .screen::-webkit-scrollbar-thumb{background:var(--frame);border-radius:6px}
  .line{white-space:pre-wrap;word-break:break-word}
  .prompt{color:var(--green)} .path{color:var(--cyan)} .dim{color:var(--dim)}
  .ok{color:var(--green)} .hd{color:#e6edf3;font-weight:700}
  a{color:var(--cyan);text-decoration:none;border-bottom:1px dotted var(--cyan)}
  a:hover{color:var(--green);border-bottom-color:var(--green)}
  .inrow{display:flex;gap:8px;align-items:baseline}
  .inrow .in{flex:1;min-width:0;background:transparent;border:0;outline:none;
    color:var(--fg);font:inherit;caret-color:var(--green)}
</style>
</head>
<body>
<div class="win" id="win">
  <div class="bar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="t">kunal@github: ~</span>
  </div>
  <div class="screen" id="screen" aria-live="polite"></div>
</div>

<script>
const screen = document.getElementById('screen');
const PROMPT = '<span class="prompt">kunal@github</span> <span class="path">~</span> <span class="prompt">$</span> ';

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function out(html){const d=document.createElement('div');d.className='line';d.innerHTML=html;screen.appendChild(d);screen.scrollTop=screen.scrollHeight}

/* ---- commands come from data/commands.json (edit that file to add more) ---- */
let CMDS = {}, ORDER = [], PROFILE = {};
const ALIASES = {ls:'help', ll:'help', cat:'about', home:'whoami', '?':'help'};

async function loadCommands(){
  const res = await fetch('data/commands.json', {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  PROFILE = data.profile || {};
  CMDS = {}; ORDER = [];
  (data.commands || []).forEach(c => { if(c && c.name){ CMDS[c.name] = c; ORDER.push(c.name); } });
}

function renderCmd(c){
  const parts = [];
  if(c.title) parts.push(`<span class="hd">${esc(c.title)}</span>`);
  (c.lines || []).forEach(l => parts.push(esc(l)));
  (c.links || []).forEach(k =>
    parts.push(`  ${esc(k.label)}  <a href="${esc(k.url)}" target="_blank" rel="noopener">${esc(k.text || k.url)}</a>`));
  out(parts.join('\n') || '<span class="dim">(empty command)</span>');
}

function showHelp(){
  const rows = ORDER.map(n => `  <span class="ok">${esc(n)}</span>${' '.repeat(Math.max(1,14-n.length))}${esc((CMDS[n].desc)||'')}`);
  rows.push(`  <span class="ok">help</span>          this list`);
  rows.push(`  <span class="ok">clear</span>         wipe the screen`);
  out(`<span class="hd">available commands</span>\n${rows.join('\n')}\n<span class="dim">tip: ↑ / ↓ history, Tab to autocomplete</span>`);
}

function run(raw){
  const cmd = raw.trim();
  // note: the finished input line already shows "PROMPT + command",
  // so we do NOT echo it again here (that caused the command to print twice).
  if(!cmd) return;
  let key = cmd.toLowerCase().split(/\s+/)[0];
  if(ALIASES[key]) key = ALIASES[key];
  if(key === 'help'){ showHelp(); return; }
  if(key === 'clear'){ screen.innerHTML=''; return; }
  if(CMDS[key]){ renderCmd(CMDS[key]); return; }
  out(`<span class="dim">command not found:</span> ${esc(key)} <span class="dim">— try </span><span class="ok">help</span>`);
}

/* ---- live input line ---- */
let history=[], hpos=-1;
function newPrompt(){
  const row=document.createElement('div'); row.className='line inrow';
  row.innerHTML=`<span>${PROMPT}</span>`;
  const inp=document.createElement('input');
  inp.className='in'; inp.autocapitalize='off'; inp.autocomplete='off';
  inp.spellcheck=false; inp.setAttribute('aria-label','terminal input');
  row.appendChild(inp); screen.appendChild(row); screen.scrollTop=screen.scrollHeight; inp.focus();
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      const v=inp.value; row.removeChild(inp);
      const g=document.createElement('span'); g.textContent=v; row.appendChild(g);
      if(v.trim()) history.push(v); hpos=history.length;
      run(v); newPrompt();
    } else if(e.key==='ArrowUp'){
      if(history.length){hpos=Math.max(0,hpos-1);inp.value=history[hpos]||'';
        requestAnimationFrame(()=>inp.setSelectionRange(inp.value.length,inp.value.length));}
      e.preventDefault();
    } else if(e.key==='ArrowDown'){
      if(history.length){hpos=Math.min(history.length,hpos+1);inp.value=history[hpos]||'';}
      e.preventDefault();
    } else if(e.key==='Tab'){
      e.preventDefault();
      const part=inp.value.trim().toLowerCase();
      const hit=[...ORDER,'help','clear'].find(c=>c.startsWith(part));
      if(hit) inp.value=hit;
    }
  });
}
screen.addEventListener('click',()=>{const i=screen.querySelector('input');if(i)i.focus()});

/* ---- boot ---- */
async function boot(){
  let ok=true;
  try{ await loadCommands(); }catch(e){ ok=false; }
  const seq = ok ? [
    '<span class="dim">Last login: now on ttys001</span>',
    `<span class="ok">✓</span> loading profile for <span class="hd">${esc(PROFILE.name||'Kunal Kumar')}</span>`,
    `<span class="dim">${esc(PROFILE.role||'')}</span>`,
    '',
    `<span class="dim">Type</span> <span class="ok">help</span> <span class="dim">to get started.</span>`,
    ''
  ] : [
    '<span class="dim">Last login: now on ttys001</span>',
    `<span class="dim">(could not load data/commands.json — open this page from the live site</span>`,
    `<span class="dim"> or a local server, e.g. </span><span class="ok">python -m http.server</span><span class="dim">, so the file can be fetched)</span>`,
    ''
  ];
  let i=0;
  (function step(){ if(i<seq.length){ out(seq[i++]); setTimeout(step,240);} else newPrompt(); })();
}
boot();
</script>
</body>
</html>
